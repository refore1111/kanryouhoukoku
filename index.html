<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工事箇所報告書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f4f2;
    --surface:#ffffff;
    --ink:#1c2b33;
    --ink-soft:#5b6b72;
    --line:#d9e0df;
    --line-strong:#b9c4c3;
    --blue:#2f5d74;
    --blue-deep:#203f50;
    --amber:#c97a2b;
    --amber-deep:#a5611c;
    --brick:#a8443a;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans JP", "Hiragino Sans", sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:28px 16px 80px;
  }
  .wrap{ max-width:880px; margin:0 auto; }

  /* ---------- Header ---------- */
  .masthead{
    background:var(--surface);
    border:1px solid var(--line);
    border-top:5px solid var(--blue);
    border-radius:2px;
    padding:26px 28px 22px;
    margin-bottom:22px;
  }
  .masthead-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:16px; flex-wrap:wrap; margin-bottom:18px;
  }
  .masthead h1{
    font-family:"Shippori Mincho", serif;
    font-weight:800;
    font-size:26px;
    letter-spacing:.06em;
    margin:0 0 4px;
    color:var(--blue-deep);
  }
  .masthead .sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0;
    max-width:520px;
  }
  .meta-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px 24px;
  }
  @media (max-width:620px){ .meta-grid{ grid-template-columns:1fr; } }
  .meta-block{ border-top:1px solid var(--line); padding-top:14px; }
  .meta-block h2{
    font-size:11px;
    color:var(--blue);
    font-weight:700;
    letter-spacing:.05em;
    margin:0 0 10px;
  }
  .field{ margin-bottom:10px; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .field input[type=text], .field input[type=date], .field select{
    width:100%;
    border:1px solid var(--line-strong);
    border-radius:2px;
    padding:8px 10px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:#fbfcfc;
  }
  .field input:focus, .field select:focus, textarea:focus{
    outline:none;
    border-color:var(--blue);
    background:#fff;
  }

  /* ---------- Location cards ---------- */
  #locationsList{ display:flex; flex-direction:column; gap:18px; margin-bottom:18px; }
  .loc-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:2px;
    padding:22px 24px 22px 84px;
    position:relative;
  }
  .loc-num{
    position:absolute;
    left:0; top:0;
    width:64px; height:100%;
    display:flex; align-items:flex-start; justify-content:center;
    padding-top:24px;
    font-family:"Shippori Mincho", serif;
    font-weight:700;
    font-size:28px;
    color:var(--blue);
    background:linear-gradient(180deg,#eef3f4,#f7f9f9);
    border-right:1px solid var(--line);
  }
  .loc-head{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:12px; margin-bottom:14px;
  }
  .loc-head .field{ flex:1; margin-bottom:0; }
  .loc-head .field input{ font-size:15.5px; font-weight:500; }
  .btn-del-loc{
    flex-shrink:0; margin-top:20px;
    background:none; border:1px solid var(--line-strong);
    color:var(--brick); border-radius:2px;
    font-size:12px; padding:7px 10px; cursor:pointer;
    font-family:inherit;
  }
  .btn-del-loc:hover{ background:#fbeceb; border-color:var(--brick); }

  textarea{
    width:100%;
    border:1px solid var(--line-strong);
    border-radius:2px;
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:#fbfcfc;
    resize:vertical;
    min-height:56px;
  }
  .loc-fields .field{ margin-bottom:12px; }
  .content-quickfill{ margin-bottom:6px; }
  .content-quickfill select{
    width:100%; border:1px solid var(--line); border-radius:2px;
    padding:6px 8px; font-size:12.5px; color:var(--ink-soft);
    background:#fbfcfc; font-family:inherit;
  }
  .content-quickfill select:focus{ outline:none; border-color:var(--blue); }

  .photo-section{ margin-top:16px; }
  .photo-section h3{
    font-size:11.5px; color:var(--ink-soft); font-weight:700;
    letter-spacing:.03em; margin:0 0 8px;
  }
  .photo-grid{
    display:flex; flex-wrap:wrap; gap:10px;
  }
  .photo-thumb{
    position:relative; width:84px; height:84px;
    border-radius:2px; overflow:hidden; border:1px solid var(--line-strong);
    background:#eee;
  }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb .tag{
    position:absolute; left:3px; top:3px;
    background:rgba(32,63,80,.82); color:#fff;
    font-size:10px; padding:1px 5px; border-radius:2px;
    font-weight:500;
  }
  .photo-thumb .rm{
    position:absolute; right:2px; top:2px;
    width:18px; height:18px; border-radius:50%;
    background:rgba(28,43,51,.72); color:#fff;
    border:none; cursor:pointer; font-size:12px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-thumb .rm:hover{ background:var(--brick); }
  .photo-add{
    width:84px; height:84px; border-radius:2px;
    border:1.5px dashed var(--line-strong);
    background:#fbfcfc;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--blue); cursor:pointer; font-size:11px; text-align:center; gap:4px;
    padding:4px; font-family:inherit;
  }
  .photo-add:hover{ border-color:var(--blue); background:#eef4f6; }
  .photo-add .plus{ font-size:20px; line-height:1; font-weight:500; }
  .photo-add:disabled, .photo-add.disabled{ opacity:.4; pointer-events:none; cursor:default; }

  /* ---------- Photo source menu (camera / library / file) ---------- */
  .photo-menu-overlay{
    position:fixed; inset:0; background:rgba(20,34,41,.45);
    display:none; align-items:flex-end; justify-content:center;
    padding:16px; z-index:1000;
  }
  @media (min-width:640px){ .photo-menu-overlay{ align-items:center; } }
  .photo-menu{
    background:#fff; border-radius:10px; width:100%; max-width:360px;
    overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  .photo-menu button{
    width:100%; text-align:left; padding:15px 18px; border:none; background:#fff;
    font-family:inherit; font-size:15px; color:var(--ink); cursor:pointer;
    border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
  }
  .photo-menu button:last-child{ border-bottom:none; }
  .photo-menu button:hover, .photo-menu button:active{ background:#f2f4f2; }
  .photo-menu button.photo-menu-cancel{
    color:var(--ink-soft); justify-content:center; font-weight:500;
    border-top:6px solid var(--bg);
  }

  /* ---------- Add location / footer bar ---------- */
  .add-loc-btn{
    width:100%; padding:14px; border:1.5px dashed var(--line-strong);
    background:#fbfcfc; color:var(--blue); font-size:14px; font-weight:500;
    border-radius:2px; cursor:pointer; font-family:inherit;
    margin-bottom:26px;
  }
  .add-loc-btn:hover{ border-color:var(--blue); background:#eef4f6; }

  .action-bar{
    position:sticky; bottom:0;
    background:var(--surface); border:1px solid var(--line);
    border-radius:2px; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
    box-shadow:0 -2px 10px rgba(0,0,0,.04);
  }
  .photo-counter{ font-size:12.5px; color:var(--ink-soft); }
  .photo-counter b{ color:var(--ink); }
  .action-bar .right{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn-primary{
    background:var(--amber); color:#fff; border:none;
    padding:11px 22px; font-size:14px; font-weight:700;
    border-radius:2px; cursor:pointer; font-family:inherit;
    letter-spacing:.02em;
  }
  .btn-primary:hover{ background:var(--amber-deep); }
  .btn-ghost{
    background:none; border:1px solid var(--line-strong); color:var(--ink-soft);
    padding:10px 16px; font-size:13px; border-radius:2px; cursor:pointer; font-family:inherit;
    white-space:nowrap;
  }
  .btn-ghost:hover{ color:var(--blue); border-color:var(--blue); }
  .btn-ghost.danger:hover{ color:var(--brick); border-color:var(--brick); }
  .hint{
    font-size:11.5px; color:var(--ink-soft); margin-top:10px; text-align:right;
  }
  .empty-state{
    text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px;
  }

  /* ---------- Settings view ---------- */
  .settings-head-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; margin-bottom:10px;
  }
  .settings-head-row h1{ margin:0; }
  .master-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:18px;
  }
  @media (max-width:680px){ .master-grid{ grid-template-columns:1fr; } }
  .master-card{
    background:var(--surface); border:1px solid var(--line); border-radius:2px;
    padding:20px 22px;
  }
  .master-card h2{
    font-size:13.5px; color:var(--blue-deep); margin:0 0 14px; font-weight:700;
  }
  .master-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .master-row input{
    flex:1; border:1px solid var(--line-strong); border-radius:2px;
    padding:7px 9px; font-size:13.5px; font-family:inherit; color:var(--ink);
  }
  .master-row input:focus{ outline:none; border-color:var(--blue); }
  .master-row button{
    flex-shrink:0; width:28px; height:28px; border-radius:2px;
    border:1px solid var(--line-strong); background:#fff; color:var(--brick);
    cursor:pointer; font-size:13px;
  }
  .master-row button:hover{ background:#fbeceb; border-color:var(--brick); }
  .master-empty{ font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; }
  .master-add{
    display:flex; gap:8px; margin-top:10px; padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .master-add input{
    flex:1; border:1px solid var(--line-strong); border-radius:2px;
    padding:8px 10px; font-size:13.5px; font-family:inherit;
  }
  .master-add input:focus{ outline:none; border-color:var(--blue); }
  .master-add button{
    flex-shrink:0; background:var(--blue); color:#fff; border:none;
    border-radius:2px; padding:8px 16px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .master-add button:hover{ background:var(--blue-deep); }

  /* ---------- Print view (hidden on screen) ---------- */
  #printArea{ display:none; }

  @media print{
    html, body{ background:#fff !important; margin:0; padding:0; }
    .no-print{ display:none !important; }
    /* Hide everything on the page except #printArea, no matter what other
       markup surrounds this app (e.g. if embedded inside another site/page) */
    body *{ visibility:hidden !important; }
    #printArea, #printArea *{ visibility:visible !important; }
    #printArea{
      display:block !important;
      position:absolute; left:0; top:0; width:100%; margin:0; padding:0;
    }
    @page{ size:A4; margin:16mm 14mm; }

    .p-title{
      font-family:"Shippori Mincho", serif;
      font-size:23px; font-weight:800; text-align:center;
      letter-spacing:.12em; margin:0 0 16px; color:#1c2b33;
    }
    .p-meta{
      display:flex; justify-content:space-between; gap:24px;
      border-top:1.5px solid #1c2b33; border-bottom:1px solid #999;
      padding:10px 2px; margin-bottom:20px; font-size:11.5px;
    }
    .p-meta-col div{ margin-bottom:3px; }
    .p-meta-col b{ display:inline-block; width:64px; color:#5b6b72; font-weight:500; }
    .p-loc{ break-inside:avoid; margin-bottom:22px; }
    .p-loc-head{
      display:flex; align-items:baseline; gap:8px;
      border-bottom:2px solid #2f5d74; padding-bottom:5px; margin-bottom:10px;
    }
    .p-loc-num{ font-family:"Shippori Mincho", serif; font-weight:700; color:#2f5d74; font-size:15px; }
    .p-loc-name{ font-size:15px; font-weight:700; }
    .p-row{ display:flex; gap:10px; font-size:12px; margin-bottom:7px; }
    .p-row .lbl{ flex-shrink:0; width:62px; color:#5b6b72; }
    .p-row .val{ white-space:pre-wrap; flex:1; }
    .p-photos{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .p-photo{ width:31%; position:relative; }
    .p-photo img{ width:100%; height:32mm; object-fit:cover; border:1px solid #ccc; display:block; }
    .p-photo .n{ position:absolute; left:2px; top:2px; background:rgba(32,63,80,.85); color:#fff; font-size:8.5px; padding:1px 4px; }
    .p-footer{
      margin-top:26px; padding-top:8px; border-top:1px solid #ccc;
      font-size:10px; color:#5b6b72; text-align:center;
    }
  }
</style>
</head>
<body>

<!-- ===================== MAIN VIEW ===================== -->
<div class="wrap no-print" id="mainView">

  <div class="masthead">
    <div class="masthead-top">
      <div>
        <h1>工事箇所報告書</h1>
        <p class="sub">工事箇所ごとに名称・施工内容・備考と写真を記録し、PDFとして出力できます。</p>
      </div>
      <button class="btn-ghost" id="openSettingsBtn">⚙ マスタ設定</button>
    </div>

    <div class="meta-grid">
      <div class="meta-block">
        <h2>現場情報</h2>
        <div class="field">
          <label>工事名</label>
          <input type="text" id="projectName" placeholder="例）〇〇邸 原状回復工事">
        </div>
        <div class="field">
          <label>物件名</label>
          <input type="text" id="propertyName" placeholder="例）〇〇マンション 101号室">
        </div>
        <div class="field-row">
          <div class="field">
            <label>工事開始日</label>
            <input type="date" id="startDate">
          </div>
          <div class="field">
            <label>工事終了日</label>
            <input type="date" id="endDate">
          </div>
        </div>
        <div class="field">
          <label>施工会社</label>
          <select id="companySelect"></select>
        </div>
        <div class="field">
          <label>施工担当者</label>
          <select id="staffSelect"></select>
        </div>
      </div>
      <div class="meta-block">
        <h2>発行元情報</h2>
        <div class="field">
          <label>会社名</label>
          <input type="text" id="issuerName" value="株式会社Refore">
        </div>
        <div class="field">
          <label>電話番号</label>
          <input type="text" id="issuerPhone" value="03-6824-7282">
        </div>
        <div class="field">
          <label>メールアドレス</label>
          <input type="text" id="issuerEmail" value="info@refore.co.jp">
        </div>
      </div>
    </div>
  </div>

  <datalist id="locNameOptions"></datalist>

  <div id="locationsList"></div>
  <div id="emptyState" class="empty-state" style="display:none;">工事箇所がまだありません。下のボタンから追加してください。</div>

  <button class="add-loc-btn" id="addLocBtn">＋ 工事箇所を追加</button>

  <div class="action-bar">
    <div class="photo-counter">写真 <b id="photoCount">0</b> / 20 枚</div>
    <div class="right">
      <button class="btn-ghost danger" id="resetBtn">リセット</button>
      <button class="btn-primary" id="exportBtn">PDF出力（印刷プレビュー）</button>
    </div>
  </div>
  <p class="hint">印刷ダイアログの「送信先」で「PDFに保存」を選ぶとPDFファイルとして保存できます。</p>
</div>

<!-- ===================== SETTINGS VIEW ===================== -->
<div class="wrap no-print" id="settingsView" style="display:none;">
  <div class="masthead">
    <div class="settings-head-row">
      <h1>マスタ設定</h1>
      <button class="btn-ghost" id="closeSettingsBtn">← 報告書に戻る</button>
    </div>
    <p class="sub">工事箇所名称・施工内容・施工会社・施工担当者の選択肢を管理します。追加・編集・削除の内容は自動的に保存されます。</p>
  </div>

  <div class="master-grid">
    <div class="master-card">
      <h2>工事箇所名称マスタ</h2>
      <div class="master-list" id="masterList_locNames"></div>
      <div class="master-add">
        <input type="text" id="masterAddInput_locNames" placeholder="例）浴室 天井">
        <button type="button" data-add="locNames">追加</button>
      </div>
    </div>

    <div class="master-card">
      <h2>施工内容マスタ</h2>
      <div class="master-list" id="masterList_contents"></div>
      <div class="master-add">
        <input type="text" id="masterAddInput_contents" placeholder="例）クロス張替え">
        <button type="button" data-add="contents">追加</button>
      </div>
    </div>

    <div class="master-card">
      <h2>施工会社マスタ</h2>
      <div class="master-list" id="masterList_companies"></div>
      <div class="master-add">
        <input type="text" id="masterAddInput_companies" placeholder="会社名を入力">
        <button type="button" data-add="companies">追加</button>
      </div>
    </div>

    <div class="master-card">
      <h2>施工担当者マスタ</h2>
      <div class="master-list" id="masterList_staff"></div>
      <div class="master-add">
        <input type="text" id="masterAddInput_staff" placeholder="担当者名を入力">
        <button type="button" data-add="staff">追加</button>
      </div>
    </div>
  </div>
</div>

<div id="printArea"></div>

<!-- Hidden inputs used by the photo source menu -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" multiple style="display:none">
<input type="file" id="libraryInput" accept="image/*" multiple style="display:none">
<input type="file" id="fileInput" accept="image/*" multiple style="display:none">

<div class="photo-menu-overlay no-print" id="photoMenuOverlay">
  <div class="photo-menu">
    <button type="button" data-choice="camera">📷 写真を撮影</button>
    <button type="button" data-choice="library">🖼 写真アップロード（フォトライブラリ）</button>
    <button type="button" data-choice="file">📁 ファイルアップロード</button>
    <button type="button" class="photo-menu-cancel" id="photoMenuCancel">キャンセル</button>
  </div>
</div>


<script>
(function(){
  "use strict";

  var MAX_PHOTOS = 20;
  var STORAGE_KEY = "constructionReportMasters";
  var locIdSeq = 1;
  var photoIdSeq = 1;

  var DEFAULT_MASTERS = {
    locNames: ["浴室","洗面所","トイレ","キッチン","居室","玄関","バルコニー","収納・クローゼット"],
    contents: ["クロス張替え","フローリング補修","ハウスクリーニング","設備交換","鍵交換","破損箇所補修","消毒・除菌作業"],
    companies: ["株式会社Refore"],
    staff: []
  };

  var state = {
    locations: [],
    masters: {
      locNames: DEFAULT_MASTERS.locNames.slice(),
      contents: DEFAULT_MASTERS.contents.slice(),
      companies: DEFAULT_MASTERS.companies.slice(),
      staff: DEFAULT_MASTERS.staff.slice()
    }
  };

  function newLocation(){
    return { id: "l" + (locIdSeq++), name:"", content:"", notes:"", photos:[] };
  }
  state.locations.push(newLocation());

  function hasStorage(){
    return typeof window.storage !== "undefined" && window.storage;
  }

  function loadMasters(){
    if(!hasStorage()) return Promise.resolve();
    return window.storage.get(STORAGE_KEY, false).then(function(res){
      if(res && res.value){
        var parsed = JSON.parse(res.value);
        state.masters = {
          locNames: Array.isArray(parsed.locNames) ? parsed.locNames : DEFAULT_MASTERS.locNames.slice(),
          contents: Array.isArray(parsed.contents) ? parsed.contents : DEFAULT_MASTERS.contents.slice(),
          companies: (Array.isArray(parsed.companies) && parsed.companies.length) ? parsed.companies : DEFAULT_MASTERS.companies.slice(),
          staff: Array.isArray(parsed.staff) ? parsed.staff : DEFAULT_MASTERS.staff.slice()
        };
      }
    }).catch(function(){ /* not found yet - keep defaults */ });
  }

  function saveMasters(){
    if(!hasStorage()) return;
    window.storage.set(STORAGE_KEY, JSON.stringify(state.masters), false).catch(function(e){
      console.error("master save failed", e);
    });
  }

  // ---------- helpers ----------
  function totalPhotoCount(){
    var n = 0;
    state.locations.forEach(function(l){ n += l.photos.length; });
    return n;
  }
  function escapeHtml(str){
    return (str || "").replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }
  function findLoc(id){
    return state.locations.filter(function(l){ return l.id === id; })[0];
  }

  // ---------- main-view element refs ----------
  var listEl = document.getElementById("locationsList");
  var emptyStateEl = document.getElementById("emptyState");
  var photoCountEl = document.getElementById("photoCount");

  function render(){
    var count = totalPhotoCount();
    photoCountEl.textContent = count;
    var atLimit = count >= MAX_PHOTOS;

    if(state.locations.length === 0){
      listEl.innerHTML = "";
      emptyStateEl.style.display = "block";
      return;
    }
    emptyStateEl.style.display = "none";

    listEl.innerHTML = state.locations.map(function(loc, idx){
      var num = String(idx+1).padStart(2,"0");

      var photosHtml = loc.photos.map(function(p, pi){
        return '<div class="photo-thumb">' +
          '<img src="' + p.dataUrl + '" alt="写真">' +
          '<span class="tag">' + (pi+1) + '</span>' +
          '<button type="button" class="rm" data-action="rm-photo" data-loc="' + loc.id + '" data-photo="' + p.id + '">×</button>' +
          '</div>';
      }).join("");

      var addTile = '<button type="button" class="photo-add" data-action="open-photo-menu" data-loc="' + loc.id + '"' +
        (atLimit ? ' disabled' : '') +
        ' title="' + (atLimit ? "上限(20枚)に達しました" : "写真を追加") + '">' +
        '<span class="plus">＋</span><span>写真追加</span>' +
        '</button>';

      var contentPicker = state.masters.contents.length ?
        ('<div class="content-quickfill"><select class="content-picker" data-loc="' + loc.id + '">' +
          '<option value="">よく使う内容から追加...</option>' +
          state.masters.contents.map(function(c){ return '<option value="' + escapeHtml(c) + '">' + escapeHtml(c) + '</option>'; }).join("") +
          '</select></div>') : '';

      return (
        '<div class="loc-card" data-loc-id="' + loc.id + '">' +
          '<div class="loc-num">' + num + '</div>' +
          '<div class="loc-head">' +
            '<div class="field">' +
              '<label>工事箇所名称</label>' +
              '<input type="text" data-field="name" data-loc="' + loc.id + '" list="locNameOptions" value="' + escapeHtml(loc.name) + '" placeholder="例）浴室 天井（一覧からも選択できます）">' +
            '</div>' +
            '<button type="button" class="btn-del-loc" data-action="rm-loc" data-loc="' + loc.id + '">この箇所を削除</button>' +
          '</div>' +
          '<div class="loc-fields">' +
            '<div class="field">' +
              '<label>施工内容</label>' +
              contentPicker +
              '<textarea data-field="content" data-loc="' + loc.id + '" placeholder="実施した作業内容を記入">' + escapeHtml(loc.content) + '</textarea>' +
            '</div>' +
            '<div class="field">' +
              '<label>備考</label>' +
              '<textarea data-field="notes" data-loc="' + loc.id + '" placeholder="特記事項があれば記入">' + escapeHtml(loc.notes) + '</textarea>' +
            '</div>' +
          '</div>' +
          '<div class="photo-section">' +
            '<h3>写真（' + loc.photos.length + '枚）</h3>' +
            '<div class="photo-grid">' + photosHtml + addTile + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function renderLocNameDatalist(){
    var dl = document.getElementById("locNameOptions");
    dl.innerHTML = state.masters.locNames.map(function(v){
      return '<option value="' + escapeHtml(v) + '">';
    }).join("");
  }

  function fillSelect(id, arr, preferredDefault){
    var sel = document.getElementById(id);
    var prevVal = sel.value;
    if(!arr.length){
      sel.innerHTML = '<option value="">（設定画面で登録してください）</option>';
      sel.value = "";
      return;
    }
    sel.innerHTML = arr.map(function(v){
      return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>';
    }).join("");
    if(arr.indexOf(prevVal) !== -1){
      sel.value = prevVal;
    } else if(preferredDefault && arr.indexOf(preferredDefault) !== -1){
      sel.value = preferredDefault;
    } else {
      sel.value = arr[0];
    }
  }

  function renderMetaSelects(){
    fillSelect("companySelect", state.masters.companies, "株式会社Refore");
    fillSelect("staffSelect", state.masters.staff, null);
  }

  function syncFromMasters(){
    renderLocNameDatalist();
    renderMetaSelects();
    render();
  }

  // ---------- meta getters ----------
  function getMeta(){
    return {
      projectName: document.getElementById("projectName").value,
      propertyName: document.getElementById("propertyName").value,
      startDate: document.getElementById("startDate").value,
      endDate: document.getElementById("endDate").value,
      company: document.getElementById("companySelect").value,
      staff: document.getElementById("staffSelect").value,
      issuerName: document.getElementById("issuerName").value,
      issuerPhone: document.getElementById("issuerPhone").value,
      issuerEmail: document.getElementById("issuerEmail").value
    };
  }

  // ---------- delegated events: location list ----------
  listEl.addEventListener("input", function(e){
    var field = e.target.getAttribute("data-field");
    if(!field) return;
    var loc = findLoc(e.target.getAttribute("data-loc"));
    if(!loc) return;
    loc[field] = e.target.value;
  });

  listEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");
    if(action === "rm-loc"){
      var locId = btn.getAttribute("data-loc");
      if(confirm("この工事箇所を削除しますか？（写真も削除されます）")){
        state.locations = state.locations.filter(function(l){ return l.id !== locId; });
        render();
      }
    } else if(action === "rm-photo"){
      var lid = btn.getAttribute("data-loc");
      var pid = btn.getAttribute("data-photo");
      var loc = findLoc(lid);
      if(loc){
        loc.photos = loc.photos.filter(function(p){ return p.id !== pid; });
        render();
      }
    } else if(action === "open-photo-menu"){
      openPhotoMenu(btn.getAttribute("data-loc"));
    }
  });

  listEl.addEventListener("change", function(e){
    if(e.target.matches(".content-picker")){
      var lid2 = e.target.getAttribute("data-loc");
      var loc2 = findLoc(lid2);
      var val = e.target.value;
      if(loc2 && val){
        loc2.content = loc2.content ? (loc2.content + "\n" + val) : val;
        var card = e.target.closest(".loc-card");
        var ta = card ? card.querySelector('textarea[data-field="content"]') : null;
        if(ta) ta.value = loc2.content;
      }
      e.target.value = "";
    }
  });

  // ---------- photo source menu (camera / library / file) ----------
  var currentPhotoLocId = null;
  var photoMenuOverlay = document.getElementById("photoMenuOverlay");
  var cameraInput = document.getElementById("cameraInput");
  var libraryInput = document.getElementById("libraryInput");
  var fileInput = document.getElementById("fileInput");

  function openPhotoMenu(locId){
    currentPhotoLocId = locId;
    photoMenuOverlay.style.display = "flex";
  }
  function hidePhotoMenu(){
    photoMenuOverlay.style.display = "none";
  }

  photoMenuOverlay.addEventListener("click", function(e){
    if(e.target === photoMenuOverlay || e.target.id === "photoMenuCancel"){
      hidePhotoMenu();
      currentPhotoLocId = null;
      return;
    }
    var choiceBtn = e.target.closest("[data-choice]");
    if(!choiceBtn) return;
    var choice = choiceBtn.getAttribute("data-choice");
    hidePhotoMenu();
    if(choice === "camera") cameraInput.click();
    else if(choice === "library") libraryInput.click();
    else if(choice === "file") fileInput.click();
  });

  function handlePhotoFiles(fileList){
    if(!currentPhotoLocId) return;
    var loc = findLoc(currentPhotoLocId);
    currentPhotoLocId = null;
    if(!loc) return;
    var files = Array.prototype.slice.call(fileList || []);
    if(files.length === 0) return;

    var remaining = MAX_PHOTOS - totalPhotoCount();
    if(remaining <= 0){
      alert("写真は合計20枚までアップロードできます。");
      return;
    }
    if(files.length > remaining){
      alert("残り枚数は" + remaining + "枚です。先頭から" + remaining + "枚のみ追加します。");
      files = files.slice(0, remaining);
    }

    var pending = files.length;
    files.forEach(function(file){
      var reader = new FileReader();
      reader.onload = function(ev){
        loc.photos.push({ id:"p" + (photoIdSeq++), dataUrl: ev.target.result });
        pending--;
        if(pending === 0){ render(); }
      };
      reader.onerror = function(){
        pending--;
        if(pending === 0){ render(); }
      };
      reader.readAsDataURL(file);
    });
  }

  [cameraInput, libraryInput, fileInput].forEach(function(input){
    input.addEventListener("change", function(e){
      handlePhotoFiles(e.target.files);
      e.target.value = "";
    });
  });

  // ---------- add / reset ----------
  document.getElementById("addLocBtn").addEventListener("click", function(){
    state.locations.push(newLocation());
    render();
    requestAnimationFrame(function(){
      var cards = listEl.querySelectorAll(".loc-card");
      var last = cards[cards.length-1];
      if(last) last.scrollIntoView({behavior:"smooth", block:"center"});
    });
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(confirm("入力した内容と写真をすべて削除します。よろしいですか？（マスタ設定は保持されます）")){
      state.locations = [newLocation()];
      ["projectName","propertyName","startDate","endDate"].forEach(function(id){
        document.getElementById(id).value = "";
      });
      renderMetaSelects();
      render();
    }
  });

  // ---------- PDF export (print) ----------
  var printAreaEl = document.getElementById("printArea");

  function fmtPeriod(s, e){
    if(!s && !e) return "―";
    return (s || "未定") + " ～ " + (e || "未定");
  }

  function buildPrintView(){
    var meta = getMeta();

    var locsHtml = state.locations.map(function(loc, idx){
      var num = String(idx+1).padStart(2,"0");
      var photosHtml = loc.photos.map(function(p, pi){
        return '<div class="p-photo"><img src="' + p.dataUrl + '"><span class="n">' + (pi+1) + '</span></div>';
      }).join("");

      return (
        '<div class="p-loc">' +
          '<div class="p-loc-head"><span class="p-loc-num">' + num + '</span><span class="p-loc-name">' + escapeHtml(loc.name || "（名称未記入）") + '</span></div>' +
          '<div class="p-row"><span class="lbl">施工内容</span><span class="val">' + escapeHtml(loc.content || "―") + '</span></div>' +
          '<div class="p-row"><span class="lbl">備考</span><span class="val">' + escapeHtml(loc.notes || "―") + '</span></div>' +
          (photosHtml ? '<div class="p-photos">' + photosHtml + '</div>' : '') +
        '</div>'
      );
    }).join("");

    printAreaEl.innerHTML =
      '<div class="p-title">工事箇所報告書</div>' +
      '<div class="p-meta">' +
        '<div class="p-meta-col">' +
          '<div><b>工事名</b>' + escapeHtml(meta.projectName || "―") + '</div>' +
          '<div><b>物件名</b>' + escapeHtml(meta.propertyName || "―") + '</div>' +
          '<div><b>工事期間</b>' + fmtPeriod(meta.startDate, meta.endDate) + '</div>' +
          '<div><b>施工会社</b>' + escapeHtml(meta.company || "―") + '</div>' +
          '<div><b>担当者</b>' + escapeHtml(meta.staff || "―") + '</div>' +
        '</div>' +
        '<div class="p-meta-col">' +
          '<div><b>発行元</b>' + escapeHtml(meta.issuerName || "―") + '</div>' +
          '<div><b>電話</b>' + escapeHtml(meta.issuerPhone || "―") + '</div>' +
          '<div><b>メール</b>' + escapeHtml(meta.issuerEmail || "―") + '</div>' +
        '</div>' +
      '</div>' +
      locsHtml +
      '<div class="p-footer">' + escapeHtml(meta.issuerName || "") + (meta.issuerPhone ? " ／ " + escapeHtml(meta.issuerPhone) : "") + (meta.issuerEmail ? " ／ " + escapeHtml(meta.issuerEmail) : "") + '</div>';
  }

  document.getElementById("exportBtn").addEventListener("click", function(){
    if(state.locations.length === 0){
      alert("工事箇所を1件以上追加してください。");
      return;
    }
    buildPrintView();
    setTimeout(function(){ window.print(); }, 60);
  });

  // ---------- settings view ----------
  var settingsViewEl = document.getElementById("settingsView");
  var mainViewEl = document.getElementById("mainView");
  var MASTER_KEYS = ["locNames","contents","companies","staff"];

  function renderMasterList(key){
    var el = document.getElementById("masterList_" + key);
    var arr = state.masters[key];
    if(!arr.length){
      el.innerHTML = '<p class="master-empty">まだ登録がありません</p>';
      return;
    }
    el.innerHTML = arr.map(function(item, i){
      return '<div class="master-row">' +
        '<input type="text" value="' + escapeHtml(item) + '" data-edit="' + key + '" data-index="' + i + '">' +
        '<button type="button" data-del="' + key + '" data-index="' + i + '" title="削除">×</button>' +
        '</div>';
    }).join("");
  }

  function renderAllMasterLists(){
    MASTER_KEYS.forEach(renderMasterList);
  }

  function doAddMasterItem(key){
    var input = document.getElementById("masterAddInput_" + key);
    var val = input.value.trim();
    if(!val) return;
    state.masters[key].push(val);
    input.value = "";
    renderMasterList(key);
    saveMasters();
    input.focus();
  }

  document.getElementById("openSettingsBtn").addEventListener("click", function(){
    mainViewEl.style.display = "none";
    settingsViewEl.style.display = "block";
    renderAllMasterLists();
    window.scrollTo(0,0);
  });

  document.getElementById("closeSettingsBtn").addEventListener("click", function(){
    settingsViewEl.style.display = "none";
    mainViewEl.style.display = "block";
    syncFromMasters();
    window.scrollTo(0,0);
  });

  settingsViewEl.addEventListener("click", function(e){
    var delBtn = e.target.closest("[data-del]");
    if(delBtn){
      var key = delBtn.getAttribute("data-del");
      var idx = parseInt(delBtn.getAttribute("data-index"), 10);
      state.masters[key].splice(idx, 1);
      renderMasterList(key);
      saveMasters();
      return;
    }
    var addBtn = e.target.closest("[data-add]");
    if(addBtn){
      doAddMasterItem(addBtn.getAttribute("data-add"));
    }
  });

  settingsViewEl.addEventListener("change", function(e){
    var editInput = e.target.closest("[data-edit]");
    if(!editInput) return;
    var key = editInput.getAttribute("data-edit");
    var idx = parseInt(editInput.getAttribute("data-index"), 10);
    var val = editInput.value.trim();
    if(!val){
      state.masters[key].splice(idx, 1);
      renderMasterList(key);
    } else {
      state.masters[key][idx] = val;
    }
    saveMasters();
  });

  settingsViewEl.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    if(e.target.closest("[data-edit]")){
      e.preventDefault();
      e.target.blur();
    } else if(e.target.id && e.target.id.indexOf("masterAddInput_") === 0){
      e.preventDefault();
      doAddMasterItem(e.target.id.replace("masterAddInput_",""));
    }
  });

  // ---------- init ----------
  loadMasters().then(function(){
    syncFromMasters();
  });
})();
</script>
</body>
</html>
